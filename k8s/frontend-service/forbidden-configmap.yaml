apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html
data:
  forbidden.html: |
    <!DOCTYPE html>
    <html>
    <head>
    <title>Forbidden Requests</title>

    <style>

    body{
        font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
        background:#0f172a;
        color:#e2e8f0;
        padding:40px;
    }

    .container{
        background:#1e293b;
        padding:30px;
        border-radius:12px;
        max-width:700px;
    }

    button{
        width:200px;
        padding:12px;
        margin:10px;
        background:#dc2626;
        color:white;
        border:none;
        border-radius:8px;
        cursor:pointer;
    }

    button:hover{
        background:#ef4444;
    }

    pre{
        background:#020617;
        padding:20px;
        border-radius:10px;
        margin-top:20px;
        color:#38bdf8;
    }

    </style>

    </head>

    <body>

    <div class="container">

    <h1>Forbidden Requests</h1>

    <p>
    Test Istio AuthorizationPolicy blocking.
    </p>

    <button onclick="testPut()">
    PUT Request
    </button>

    <button onclick="testDelete()">
    DELETE Request
    </button>


    <pre id="output">
    Waiting...
    </pre>

    </div>


    <script>

    async function testPut(){

        const response = await fetch("/update",{
            method:"PUT",
            headers:{
                "Content-Type":"text/plain"
            },
            body:"Unauthorized update attempt"
        });

        document.getElementById("output").textContent =
            response.status + "\n" +
            await response.text();
    }


    async function testDelete(){

        const response = await fetch("/delete",{
            method:"DELETE"
        });

        document.getElementById("output").textContent =
            response.status + "\n" +
            await response.text();
    }

    </script>

    </body>
    </html>